# Android host profile: the host supplies device control, so local sandbox and
# persistent PTY facilities are deliberately disabled.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: android
      name: cordis-plugin-android
    - id: tool-android
      name: '@deepseek-ai/dsh-tool-android'
