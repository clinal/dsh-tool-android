# Android host profile: the host supplies device control, so local sandbox and
# persistent PTY facilities are deliberately disabled.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: permission
  disabled: true
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    maxImageBytes: 33554432
    maxImagesPerMessage: 600
    maxMessageImageBytes: 67108864
    maxImagePixels: 67108864
    maxImageDimension: 8192
- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
    - id: android
      name: cordis-plugin-android
    - id: tool-android
      name: dsh-tool-android
