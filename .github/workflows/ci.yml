name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/dsh-tool-android-aarch64-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='node_modules/.cache' \
            --exclude='*.tsbuildinfo' \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tool-android-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error
