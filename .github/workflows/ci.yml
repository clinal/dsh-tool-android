name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Package
        run: |
          set -euo pipefail
          archive="dsh-tool-android-aarch64-${GITHUB_SHA}.tar.gz"
          rm -rf .git node_modules/.cache
          find . -name '*.tsbuildinfo' -delete
          tar -czf "$RUNNER_TEMP/$archive" .
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tool-android-aarch64
          path: ${{ runner.temp }}/dsh-tool-android-aarch64-${{ github.sha }}.tar.gz
          if-no-files-found: error
