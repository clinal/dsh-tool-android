name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/dsh-tool-android-aarch64-${GITHUB_SHA}.zip"
          zip -q -r -y "$archive" . \
            -x '.git/*' \
            -x 'dist/*' \
            -x 'node_modules/.cache/*' \
            -x '*.tsbuildinfo'
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tool-android-aarch64
          path: dist/*.zip
          if-no-files-found: error
