name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(jq -r .version package.json)
          node -e 'const v = process.argv[1]; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(v)) process.exit(1)' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            changed=true
          elif ! git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            changed=true
          else
            previous=$(git show "$BEFORE_SHA:package.json" | jq -r .version)
            test "$version" != "$previous" && changed=true || changed=false
          fi
          if [ "$changed" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:aarch64
      - run: gh release create "v$RELEASE_VERSION" dist/*.zip --target "$GITHUB_SHA" --generate-notes
